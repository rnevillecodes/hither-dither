# Reusable build: checks plus release-mode installers for Windows, macOS and Linux.
# Called by ci.yml (pull requests, main) and release.yml (version tags).
name: Build

on:
  workflow_call:
    inputs:
      retention-days:
        description: Days to keep the uploaded installers.
        type: number
        required: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows
            runner: windows-latest
            rust-targets: ""
            build-args: --bundles nsis,msi
            artifacts: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - name: macOS (universal)
            os: macos
            runner: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            build-args: --target universal-apple-darwin --bundles dmg
            artifacts: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Linux
            os: linux
            # Older glibc than ubuntu-latest, so the binaries run on more distributions.
            runner: ubuntu-22.04
            rust-targets: ""
            build-args: --bundles appimage,deb,rpm
            artifacts: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system packages
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev patchelf \
            build-essential pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}

      - name: Install npm packages
        run: npm ci

      - name: Type-check frontend
        run: npm run check

      - name: Frontend tests
        run: npm test

      # Plugin hosting has per-OS code, so clippy runs on every platform.
      - name: Rust format and clippy
        run: npm run lint:rust

      - name: Rust tests
        run: npm run test:rust

      - name: Read app version
        id: version
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build installers
        run: npm run tauri build -- ${{ matrix.build-args }}

      - uses: actions/upload-artifact@v4
        with:
          name: HitherDither-${{ steps.version.outputs.version }}-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
