# Checks and test installers for every pull request and push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same pull request or branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Catches a bump that missed a file (the site included) before it reaches main.
  version-check:
    name: App version agrees across files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node scripts/check-version.mjs

  build:
    uses: ./.github/workflows/build.yml
    with:
      retention-days: 14
