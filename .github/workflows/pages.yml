# Publishes site/ to GitHub Pages at https://rnevillecodes.github.io/hither-dither/.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - src-tauri/icons/app-icon.svg
      - src-tauri/icons/128x128@2x.png
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The icons come from the app so the site never drifts from them.
      - name: Assemble site
        run: |
          mkdir _site
          cp -r site/. _site/
          cp src-tauri/icons/app-icon.svg _site/icon.svg
          cp src-tauri/icons/128x128@2x.png _site/icon.png

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
