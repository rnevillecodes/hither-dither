# Publishes site/ to GitHub Pages at https://rnevillecodes.github.io/hither-dither/.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - src-tauri/icons/app-icon.svg
      - src-tauri/icons/128x128@2x.png
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The icons come from the app so the site never drifts from them.
      - name: Assemble site
        run: |
          mkdir _site
          cp -r site/. _site/
          cp src-tauri/icons/app-icon.svg _site/icon.svg
          cp src-tauri/icons/128x128@2x.png _site/icon.png

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
