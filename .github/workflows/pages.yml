# Publishes site/ to GitHub Pages at https://rnevillecodes.github.io/hither-dither/.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - src-tauri/icons/app-icon.svg
      - src-tauri/icons/128x128@2x.png
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The icons come from the app so the site never drifts from them.
      - name: Assemble site
        run: |
          mkdir _site
          cp -r site/. _site/
          cp src-tauri/icons/app-icon.svg _site/icon.svg
          cp src-tauri/icons/128x128@2x.png _site/icon.png

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
