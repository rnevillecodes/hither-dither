[package]
name = "hither-dither"
version = "0.1.0"
description = "Desktop WAV file analyser"
edition = "2024"

[lib]
# The `_lib` suffix avoids a lib/bin name clash on Windows (cargo#8519).
name = "hither_dither_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "0.9"
ebur128 = "0.1"
cpal = "0.16"
rubato = "0.16"
rtrb = "0.3"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Analysis code is slow unoptimised; keep tests and dev builds usable.
[profile.dev.package."*"]
opt-level = 2
